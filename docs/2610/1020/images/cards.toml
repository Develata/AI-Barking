[[annot.note]]
quote = "The agent also replaced an earlier regression test intended to preserve monitoring with one requiring that monitoring was not present."
gloss = "该代理还把原本用于保留监控的回归测试，替换成了要求监控不存在的测试。"

[[annot.note]]
quote = "I did not remove an enabled monitor from it."
gloss = "我没有从中移除已启用的监控器。"

[[annot]]
out = "03-locked-chats.png"
title = "ChatGPT · 更改 PIN 不删聊天"
source = "help.openai.com 原文截图（2026-10-21 存档）"
lang = "eng"

[[annot.note]]
quote = "Changing the PIN does not delete locked chats."
gloss = "更改 PIN 不会删除锁定聊天。"

[[annot.note]]
quote = "You must enter your current PIN to change it, even if you use Face ID, Touch ID, or device unlock to open locked chats."
gloss = "即使用面容、指纹或设备解锁来打开锁定聊天，更改 PIN 时仍须输入当前 PIN。"

[[annot]]
out = "06-locked-reset.png"
title = "ChatGPT · 重置 PIN 会永久删除"
source = "help.openai.com 原文截图（2026-10-21 存档）"
lang = "eng"

[[annot.note]]
quote = "Forgetting your PIN does not by itself delete your locked chats or files."
gloss = "忘记 PIN 本身不会删除锁定聊天或文件。"

[[annot.note]]
quote = "Resetting your account PIN permanently deletes all locked chats, remembered information stored only within locked chats, and files or other content protected only by your previous PIN."
gloss = "重置账户 PIN 会永久删除全部锁定聊天、仅存于锁定聊天中的记忆，以及仅受旧 PIN 保护的文件或其他内容。"

