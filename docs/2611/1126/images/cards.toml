[[annot]]
out = "mcp-scaled-billing"
post = 1
title = "Google Workspace API 与 MCP 计费档对比"
source = "developers.google.com 原文截图（2026-11-27 存档）"
lang = "eng"

[[annot.note]]
quote = "Daily no-charge allowances apply only to REST APIs. On the Standard Tier, GA Google Workspace MCP servers require no billing account and are capped at 5,000 no-cost requests per day, per project, per product. Switching a project to the Scaled Tier removes free MCP allowances, so Gmail, Calendar, and Drive MCP usage is billed from the first request with 0 daily no-charge allowance."
gloss = "每日免费额度仅适用于 REST API；标准档下正式可用的 Workspace MCP 无需账单账号，每天每项目每产品限 5,000 次免费请求；项目切到 Scaled 档则取消免费 MCP 额度，Gmail、日历、网盘 MCP 从第 1 次请求起计费，每日免费额度为 0。"

[[annot.note]]
quote = "Scaled Tier Gmail, Calendar, and Drive MCP usage has no daily no-charge allowance and is billed from the first request starting April 1, 2027."
gloss = "2027 年 4 月 1 日起，Scaled 档的 Gmail、日历、网盘 MCP 用量没有每日免费额度，从第 1 次请求起计费（非 2xx 及返回 isError: true 的失败请求不计费，另见 Gmail 配额文档）。"

# ---- 主帖 2：Claude 限能与反蒸馏 ----
[[annot]]
out = "fable-training-limit"
post = 2
title = "Anthropic 发布文 · 训练限能与推理不改这些能力"
source = "anthropic.com 原文截图（2026-11-27 存档）"
lang = "eng"

[[annot.note]]
quote = "However, during the model's training, we took steps to limit advances in the specific research capabilities that could most directly accelerate AI development. Thus, in relevant areas, including accelerator kernel optimization and improving large language model architectures, Fable 5.2 and Claude Mythos 5.2 perform at about the level of Opus 5.5."
underline = "during the model's training,"
gloss = "不过在模型训练期间，我们采取措施限制了最能直接加速 AI 研发的特定研究能力的提升；因此在加速器内核优化、改进大模型架构等相关领域，Fable-5.2 与 Mythos-5.2 大致处于 Opus-5.5 水平。"

[[annot.note]]
quote = "We do not alter these capabilities as the model is being served to users (that is, at inference time)."
gloss = "向用户提供服务时（即推理阶段），我们不会改动这些能力。"

[[annot.note]]
quote = "Fable 5.2 and Claude Mythos 5.2 also include transparent fallbacks to Opus 5 for a small set of topics in this domain, including kernel development on certain nonstandard accelerators."
gloss = "Fable-5.2 与 Mythos-5.2 还会对该领域少数主题（包括特定非标准加速器上的内核开发）明面回退到 Opus-5。"

[[annot]]
