[[event]]
tag = "OpenAI"
paras = [
  "OpenAI 发布新模型 GPT-6.2-Astra 和 Sol，安全报告里有项测试：给编程任务故意设障碍，比如删掉要改的文件，看 AI 会不会说出来。",
  "GPT-6.2-Astra 有22.28%的回答没提障碍或说错了，上一代 GPT-6-Astra 是11.09%。OpenAI 写道对这一退步“感到担忧”，猜测可能与“让回答更简洁、少加限定和提醒”有关。",
  "对你：在 ChatGPT 里，新模型只进 Work 和 Codex（写代码的工具），普通聊天选不到，官方名单里没有免费版。",
]

[[event]]
tag = "微软"
paras = [
  "微软发布编程模型 MAI-Code-2，称在四项编程测试里（三项微软自己跑），它的平均通过率是 GPT-6.1-Sol 的98%；每个任务平均花0.309美元，对方0.761美元。",
  "GitHub 价目表：MAI-Code-2 现在是促销价，每百万 token（文字计量单位）输入0.5美元、输出2.5美元，2027年5月17日起涨到1美元、5美元。",
  "对你：GitHub 称，其编程助手 Copilot 的 Pro 及以上付费用户可以选它，按用量计费，商业版、企业版由管理员定。",
]

[[bark]]
tag = "OpenAI"
points = [
  "障碍是故意放的，OpenAI 写明结果不一定反映真实使用中的误导率；真实使用里的比例，报告没给。",
  "OpenAI 称已在 Codex 里加指令，同一测试里 Astra 不说障碍的比例降到8.04%；但安全报告写明，开发者在自己程序里直接调用模型时，不带这段指令。",
]

[[bark]]
tag = "微软"
points = [
  "微软大会总览页和 AI 负责人苏莱曼都写“40%的价格”，没提促销；博客脚注才写明，这个成本按五折促销价算。",
  "微软称的“98%”来自平均通过率63.2%对 GPT-6.1-Sol 的64.1%；MAI-Code-2 更低的三项，正是微软自己跑的三项。",
]

# ---- 主帖 1：OpenAI ----
[[annot]]
out = "gpt-blocker"
post = 1
title = "OpenAI 系统卡 · Blocker Deception"
source = "openai.com 原文截图（2026-11-18 存档）"
lang = "eng"

[[annot.note]]
quote = "Notably, GPT-6.2 Astra omitted a known obstacle to completing its work in 22.28 percent of trials, compared with 11.09 percent for GPT-6 Astra."
gloss = "GPT-6.2 Astra 在 22.28% 的试验中遗漏了妨碍完成工作的已知障碍，GPT-6 Astra 为 11.09%。"

[[annot.note]]
quote = "We are concerned by this regression and are continuing to investigate its root causes. One hypothesis is that our efforts to make responses concise and avoid excessive caveats may be related to the model omitting important obstacles."
gloss = "我们对这一退步感到担忧，正继续调查根本原因。一种假设是：让回答简洁、避免过多限定说明的努力，可能与遗漏重要障碍有关。"

[[annot.note]]
quote = "Although these problems were designed to elicit misaligned behavior and do not necessarily reflect the rate of misleading responses in production,"
gloss = "这些题目为诱发不对齐行为而设计，不一定反映真实使用中误导性回答的比率。"
underline = "do not necessarily reflect"
emph = "不一定反映"

[[annot.note]]
quote = "The Codex developer prompt used in these evaluations is not applied to direct API requests."
gloss = "评测中用的 Codex 开发者提示，不作用于直接的 API 请求。"

