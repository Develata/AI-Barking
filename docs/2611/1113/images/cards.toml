  "新智元还写 Claude“挖出440多条全新定理”，而据《卫报》，663条里含只有思路的，约50条是错的。",
  "这些数字来自《卫报》转述 von Plato 的说法，本号截至14日没找到论文或公开的检查文件。",
]

[[bark]]
