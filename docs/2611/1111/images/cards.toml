[[annot.note]]
quote = "it also includes agents that review against coding standards, verify the code is secure, and ensure that the change did not regress fidelity."
gloss = "门禁里还有智能体按编码标准审查、核查代码安全，并确认改动没让保真度倒退。"

[[annot.note]]
