# —— 主帖 1：玛雅 ——

[[annot]]
out = "maya-update"
post = 1
title = "Miotti 博文现版本 · 文首更正"
source = "pietromiotti.com 原文截图（2026-11-12 存档）"
lang = "eng"

[[annot.note]]
quote = "it turns out the site had already been mapped in Estrada-Belli et al. 2025."
gloss = "（原站标注 11 月 11 日更新）原来这处遗址已在 Estrada-Belli 等人 2025 年的论文中测绘过。"

[[annot.note]]
quote = "The agents missed it while going through the literature, so they rediscovered it rather than discovered it"
gloss = "智能体查文献时漏掉了它，所以是重新发现，而不是发现。"

[[annot.note]]
quote = "less than 72 hours to go from a random thought while traveling to an official reply from the Mexican government."
gloss = "从旅途中一个念头到收到墨西哥官方回复，用了不到 72 小时。"

[[annot]]
out = "maya-original"
post = 1
title = "同一博文更正前的版本 · 网页存档"
source = "web.archive.org 存档快照（北京 2026-11-11 04:13）"
lang = "eng"

[[annot.note]]
quote = "as far as anyone can tell, no one had reported before."
gloss = "（更正前原文）据目前所知，此前没人报告过这处遗址。"

[[annot.note]]
quote = "others used lidar to estimate how many people lived in the Maya lowlands (Estrada-Belli et al. 2025)"
gloss = "（更正前文末）另有研究者用激光雷达估算玛雅低地生活过多少人（Estrada-Belli 等，2025）。"

