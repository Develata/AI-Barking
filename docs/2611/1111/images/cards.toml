[[annot]]
out = "aws-claim"
post = 2
title = "AWS 官方文 · Matthew Goldberg"
source = "aboutamazon.com 原文截图（2026-11-12 存档）"
lang = "eng"

[[annot.note]]
quote = "The emulator was written entirely by autonomous agents. Our team hasn’t written or reviewed any of the code."
gloss = "模拟器完全由自主智能体编写。我们团队没写、也没审过任何一行代码。"

[[annot]]
out = "aws-gate"
post = 2
