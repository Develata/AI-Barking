date = "11月17日"

[[tldr]]
tag = "Win11"
fact = "一位研究者发文称，他借助 AI 翻查 Win11 系统文件，发现一个负责诊断的系统组件会按程序名认出 Codex、Claude 等 AI 编程工具。"

[[tldr]]
tag = "Siri"
fact = "Siri AI、修图等要用苹果服务器上大模型的功能每天有上限；200GB 档最多2倍，12TB 档最多20倍，从27.3版系统起提供；Siri AI 目前不支持中国大陆账号，部分 Apple 智能功能在中国也不能加量。"

[[roundup]]
tag = "Win11"
main = true
text = "Win11：按程序名认出 AI 编程工具"

[[roundup]]
tag = "Siri"
main = true
text = "苹果：Siri AI 每天限量"

[[roundup]]
tag = "AMD"
text = "AMD 称已完成收购 World Labs，李飞飞任 AMD 首席科学家"

[[roundup]]
tag = "Hugging Face"
text = "HF 托管推理的语言模型改走 OpenRouter，不能再用自带供应商密钥"

[[roundup]]
tag = "Databricks"
text = "Databricks 编码自测：两模型成功率同为89.1%，按标价成本差约32倍"

[[roundup]]
tag = "Mem"
text = "笔记应用 Mem 宣布2027年1月15日关停，12月18日起笔记只读"

[[event]]
tag = "Win11"
paras = [
  "一位研究者发文称，他借助 AI 翻查 Win11 系统文件，发现一个负责诊断的系统组件会按程序名认出 Codex、Claude 等 AI 编程工具。",
  "他把系统自带的命令行程序改名成 codex.exe，运行后组件就记下“用过 Codex”，记录随后进了准备发给微软的“可选诊断数据”。",
  "他称在美国区域全新安装 Win11 时，“可选诊断数据”开关默认打开，可在设置的“诊断和反馈”里关掉。",
]

[[event]]
tag = "Siri"
paras = [
  "苹果帮助页标注11月16日更新：Siri AI、修图等要用苹果服务器上大模型的功能每天有上限；用完后定计时器这类日常请求照常，复杂请求要等额度重置，或升级到 200GB 及以上的 iCloud+ 云存储套餐。",
  "额度看 iCloud+ 档位：免费用户和 50GB 档是基础额度，200GB 档最多2倍，12TB 档最多20倍，从27.3版系统起提供；多出来的额度由同一账号的设备和共享家人一起用，先到先得。",
  "Siri AI 目前不支持中国大陆账号，部分 Apple 智能功能在中国也不能加量。",
]

[[bark]]
tag = "Win11"
points = [
  "博文只介绍了一台测试机上的记录实验，那台的记录功能已作为实验开着，不是他手动开的。",
  "原文曾写，用官方安装包装的虚拟机里这项功能默认关，证据不支持说每台 Windows 都开着；17日晚这句被删，页面没注明改动。",
  "研究者只查到记录进了待发队列，没证实数据真的发给了微软。",
  "研究者判断，这份记录似乎只写某工具“出没出现过”、不记用了多久，报告里也没看到提示词或代码。",
]

[[bark]]
tag = "Siri"
points = [
  "苹果没说基础额度一天能用几次，“最多20倍”到底是几次也就没法算。",
  "50GB 档也要付钱（国内每月6元），额度却和免费用户一样。",
  "苹果6月发布会新闻稿就写了部分功能每天限量、可靠 iCloud+ 加量，这次新公布的是各档倍数。",
]

[[annot]]
out = "win-vm"
post = 1
title = "研究者博文 · 借助 AI 找线索，测试机上功能已开"
source = "xusheng.dev 原文截图（2026-11-17，两段拼接）"
lang = "eng"

[[annot.note]]
rects = [[140, 778, 1110, 38], [140, 827, 917, 38]]
gloss = "我最近请 AI 帮我翻查最新的 Windows 系统文件，找没有公开说明的功能。"

[[annot.note]]
quote = "and CLICodingAgentUsage was already enabled as a service experiment. I had not manually enabled the feature."
gloss = "（在作者的 Parallels 虚拟机上）CLICodingAgentUsage 已作为一项服务实验开启，作者没有手动开启这项功能。"

[[annot]]
out = "win-deleted"
post = 1
title = "研究者博文 · 17日早存档版（当晚现行版已删去此段）"
source = "web.archive.org 存档截图（北京 11-17 07:00 快照）"
lang = "eng"

[[annot.note]]
quote = "The public ISO’s baseline VM had the coding-agent feature disabled by image default, so the evidence does not support saying that it is active on every Windows installation."
gloss = "用公开 ISO 安装的基线虚拟机里，这项编码代理功能按镜像默认是关的，所以证据不支持说它在每台 Windows 上都开着。"

[[annot]]
out = "win-queue"
post = 1
title = "研究者博文 · 改名测试与待上传队列"
source = "xusheng.dev 原文截图（2026-11-17，三段拼接）"
lang = "eng"

[[annot.note]]
quote = "I copied cmd.exe to a file named codex.exe and ran it in the interactive Windows session. The name alone was enough for the component to recognize it as Codex."
gloss = "我把 cmd.exe 复制成名为 codex.exe 的文件，在交互式 Windows 会话里运行。光凭名字，组件就把它认成了 Codex。"

[[annot.note]]
quote = "An ETW event by itself would not establish that anything leaves the machine."
gloss = "单凭一条 ETW 事件，并不能证明有任何数据离开了这台机器。"

[[annot.note]]
quote = "When optional diagnostic data is allowed (enabled by default in the US setup I tested), Windows queues the coding-agent usage report for upload to Microsoft."
gloss = "允许可选诊断数据时（在我测试的美国区域设置中默认开启），Windows 会把编码代理使用报告排进上传给微软的队列。"

