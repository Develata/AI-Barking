[[annot]]
out = "paper-decline"
post = 2
title = "Raymond & Dillon 论文 · 6.5 节"
source = "arxiv.org 论文 PDF 截图（2026-11-26 存档）"
lang = "eng"

[[annot.note]]
quote = "Between 2022 and 2024, our last full calendar year in the data, mean quarterly technical hiring across sample firms fell by 29%, or 16.1 hires per firm-quarter (from 55.3 to 39.2)."
gloss = "2022年至2024年（2024年为数据中最后一个完整年份），样本企业平均每季度技术岗招聘下降29%，即每家每季度少16.1人（从55.3降到39.2）。"

[[annot.note]]
quote = "This generates 1.7 forgone hires per firm-quarter or 10% of the overall aggregate decline."
gloss = "（按简约式）每家每季度少招1.7人，占总体下降的10%。"

[[annot.note]]
quote = "This makes the stronger assumption that all adopters experience the same proportional hiring decline and path as compliers. This produces an estimated reduction to 8.1 hires per firm-quarter, or 51% of the overall decline."
gloss = "（更强的假设：所有采用企业的招聘下降比例与变化路径都和提前采用者相同）估计每家每季度少招8.1人，占总体下降的51%。"
