# ---- 主帖 1：Frostbite ----
[[annot]]
out = "frostbite-tcpu"
post = 1
title = "Architect Labs 博客 · Frostbite 结果"
source = "architectlabs.com 原文截图（2026-11-20 存档）"
lang = "eng"

[[annot.note]]
quote = "We benchmark one Quad+L3 cluster against a single core of a modern superscalar (dual-issue, in-order) CPU, which we refer to as TCPU (“Traditional CPU”)."
gloss = "我们拿一个由四个计算单元组成的簇（含 L3 缓存）对比一颗现代超标量 CPU（双发射、顺序执行）的单核，称它为 TCPU（传统 CPU）。"
underline = "dual-issue, in-order"
emph = "双发射、顺序执行"

[[annot.note]]
quote = "6.02x on the 10 search-set workloads, and 3.83x on the 15 held-out workloads it was never tuned on."
gloss = "在调优用的 10 个程序上是 6.02 倍，在从没调优过的 15 个留出程序上是 3.83 倍。"

[[annot.note]]
rects = [[98, 1246, 652, 34]]
gloss = "出于法律原因，我们不能透露具体是哪款 CPU。"

[[annot]]
out = "frostbite-fig11"
post = 1
title = "Architect Labs 博客 · 图 11 每瓦性能"
source = "architectlabs.com 原文截图（2026-11-20 存档）"
lang = "eng"

[[annot.note]]
rects = [[590, 1503, 690, 32]]
gloss = "几何平均：留出集 3.83 倍，全部 25 项 4.59 倍，调优集 6.02 倍（对手 TCPU 记为 1 倍）。"

[[annot]]
out = "frostbite-next"
post = 1
title = "Architect Labs 博客 · 后续计划"
source = "architectlabs.com 原文截图（2026-11-20 存档）"
lang = "eng"

[[annot.note]]
quote = "In the coming months, we'll be benchmarking Frostbite mesh-like configurations against multi-core “TCPU” arrangements with large caches and larger, wider, out-of-order CPUs, over a larger set of industry benchmarks such as SPEC and PARSEC."
gloss = "未来几个月，我们会拿 Frostbite 的网格配置，对比带大缓存的多核 TCPU，以及更大、更宽的乱序执行 CPU，测更多行业基准，如 SPEC 和 PARSEC。"
underline = "In the coming months"
emph = "未来几个月"

