<!doctype html>
<!--
  速览专帖的固定模板封面，由 `barking card` 填充，只在 cards.toml 写了 kind = "roundup" 的期次渲染：
  images/00-cover.png（3:4，1080×1440）与 images/00-cover-wide.png（2.35:1，1880×800）。2026-10-04 起。
  画面只有栏目名、日期、条数与各条标签（公司或机构名），不写任何新闻内容，所以每天只换这几项。
  看板娘取自 common_images/profile_picture.png。横版的主标题放在中央 800 px 内，公众号可再裁出 1:1 缩略图。
  占位符：{{CLASS}}（tall | wide）{{W}} {{H}} {{DATE}} {{COUNT}} {{TAGS}} {{AVATAR}}。
-->
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: {{W}}px; height: {{H}}px; background: #f6f4ef; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; color: #1b1b1b; position: relative; overflow: hidden; }
  .band { position: absolute; background: #3a5f8f; }
  .title { position: absolute; font-weight: 900; letter-spacing: 8px; line-height: 1; }
  .title .ai { color: #3a5f8f; }
  .date { position: absolute; font-weight: 700; color: #1b1b1b; }
  .count { position: absolute; font-weight: 900; }
  .count b { background: rgba(255, 210, 0, .55); padding: 0 12px; border-radius: 8px; }
  .tags { position: absolute; display: flex; flex-wrap: wrap; gap: 14px; }
  .tags span { font-weight: 700; background: #fbfaf6; border: 2px solid #e6e1d6; border-radius: 10px; padding: 6px 18px; }
  .avatar { position: absolute; border-radius: 50%; border: 10px solid #fbfaf6; box-shadow: 0 0 0 4px #3a5f8f; }
  .brand { position: absolute; font-weight: 700; color: #7a756b; }

  /* 3:4 */
  .tall .band { left: 0; top: 0; width: 100%; height: 26px; }
  .tall .title { left: 80px; top: 120px; font-size: 200px; }
  .tall .date { left: 86px; top: 372px; font-size: 64px; }
  .tall .count { left: 86px; top: 470px; font-size: 64px; }
  .tall .tags { left: 86px; top: 600px; width: 420px; }
  .tall .tags span { font-size: 34px; }
  .tall .avatar { right: -90px; bottom: 90px; width: 640px; height: 640px; }
  .tall .brand { left: 86px; bottom: 70px; font-size: 32px; }

  /* 2.35:1 — title centred, inside the middle 800 px. */
  .wide .band { left: 0; top: 0; width: 100%; height: 22px; }
  .wide .title { left: 540px; width: 800px; top: 200px; font-size: 190px; text-align: center; }
  .wide .date { left: 540px; width: 800px; top: 440px; font-size: 60px; text-align: center; }
  .wide .count { left: 540px; width: 800px; top: 540px; font-size: 60px; text-align: center; }
  .wide .tags { left: 60px; top: 120px; width: 440px; align-content: flex-start; }
  .wide .tags span { font-size: 30px; }
  .wide .avatar { right: 50px; top: 150px; width: 500px; height: 500px; }
  .wide .brand { left: 60px; bottom: 50px; font-size: 30px; }
</style></head>
<body class="{{CLASS}}">
  <div class="band"></div>
  <div class="title"><span class="ai">AI</span> 速览</div>
  <div class="date">{{DATE}}</div>
  <div class="count">今日 <b>{{COUNT}}</b> 条</div>
  <div class="tags">{{TAGS}}</div>
  <img class="avatar" src="{{AVATAR}}" alt="">
  <div class="brand">AI 吠点 · 聊 AI 沸点，轻松识破吠点</div>
  <script>
    // The tag list is the only part that grows; report it rather than let it run under the mascot or off the page.
    const t = document.querySelector('.tags').getBoundingClientRect();
    const a = document.querySelector('.avatar').getBoundingClientRect();
    const hits = t.right > a.left && t.bottom > a.top && t.left < a.right && t.top < a.bottom;
    document.body.dataset.layout = t.bottom > innerHeight - 120 || hits
      ? `overflow:封面标签放不下（底 ${Math.round(t.bottom)} px），缩短 tag` : 'ok';
  </script>
</body></html>
