<!doctype html>
<!--
  批注截图模板（images/NN-name.png，1080×1440），由 `barking card` 填充；内容写在期次的 images/cards.toml。
  版式 2026-10-02 经 Develata 认可；2026-10-03 起不再放吠点（与正文重复），说明区只有译注。底图 NN-name-raw.png 像素不改；高亮、下划线与编号都按底图原始像素坐标叠加，
  整体随底图一起缩放。下方说明区贴底排布，脚本按它的高度算出底图能用的缩放比；编号放在底图左缘之外，
  由脚本按缩放比错开。版面溢出时脚本在 <body data-layout> 写明原因，barking card 读到即报错。
  占位符：{{TITLE}} {{IMG}} {{W}} {{H}} {{OVERLAYS}} {{NOTES}} {{SOURCE}}。
-->
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  /* Palette 2026-10-03: ink blue at low chroma, with markers softened to the same weight, so the box does not fight the warm highlights. */
  :root { --accent: #3a5f8f; --accent-bg: #e8eef5; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1440px; background: #f6f4ef; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; color: #1b1b1b; position: relative; overflow: hidden; }
  .head { position: absolute; left: 60px; top: 44px; right: 60px; display: flex; align-items: center; gap: 16px; }
  .tag { background: var(--accent); color: #fff; font-size: 26px; font-weight: 700; padding: 6px 16px; border-radius: 6px; flex: none; }
  .head .t { font-size: 30px; font-weight: 700; }
  /* --s is the screenshot scale; markers and underlines divide by it to keep a fixed on-card size. */
  .shot { --s: 1; position: absolute; left: 70px; top: 116px; transform-origin: 0 0; background: #fff; box-shadow: 0 0 0 1px #d9d5cc; }
  .shot img { display: block; width: 100%; height: 100%; }
  .hl { position: absolute; mix-blend-mode: multiply; border-radius: 2px; }
  .hl.c1 { background: rgba(255, 210, 0, .55); }
  .hl.c2 { background: rgba(255, 140, 90, .45); }
  .hl.c3 { background: rgba(110, 210, 120, .45); }
  .hl.c4 { background: rgba(190, 140, 255, .45); }
  .ul { position: absolute; height: calc(3px / var(--s)); background: #d6336c; }
  /* Markers sit just outside the screenshot's left edge, never on its pixels. */
  .mk { position: absolute; left: calc(-6px / var(--s)); width: calc(38px / var(--s)); height: calc(38px / var(--s)); border-radius: 50%; color: #fff; font: 700 calc(24px / var(--s)) / calc(38px / var(--s)) "Noto Sans SC", sans-serif; text-align: center; transform: translate(-100%, -50%); }
  .mk.c1, .n.c1 { background: #c29a2e; }
  .mk.c2, .n.c2 { background: #d8703f; }
  .mk.c3, .n.c3 { background: #4d9a68; }
  .mk.c4, .n.c4 { background: #7c68c4; }
  .panel { position: absolute; left: 60px; right: 60px; bottom: 90px; }
  /* 译注 sit in one blue box, one 译注 label on top. */
  .notes { border-left: 8px solid var(--accent); background: var(--accent-bg); padding: 14px 24px 2px 20px; border-radius: 0 10px 10px 0; }
  .row { display: flex; gap: 18px; margin-bottom: 16px; }
  .n { flex: none; width: 46px; height: 46px; border-radius: 50%; color: #fff; font-size: 26px; font-weight: 700; line-height: 46px; text-align: center; margin-top: 2px; }
  .lab { font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: 2px; margin-bottom: 8px; }
  .tx { font-size: 32px; line-height: 1.42; font-weight: 500; }
  .tx em { font-style: normal; background: linear-gradient(transparent 62%, rgba(214, 51, 108, .28) 0); }
  .q { text-indent: -.45em; }
  .foot { position: absolute; left: 60px; right: 60px; bottom: 34px; font-size: 21px; color: #7a756b; display: flex; justify-content: space-between; gap: 24px; white-space: nowrap; }
</style></head>
<body>
  <div class="head"><span class="tag">原文截图</span><span class="t">{{TITLE}}</span></div>
  <div class="shot" style="width:{{W}}px; height:{{H}}px">
    <img src="{{IMG}}" alt="">
{{OVERLAYS}}
  </div>
  <div class="panel"><div class="notes"><div class="lab">译注</div>
{{NOTES}}
  </div></div>
  <div class="foot"><span>来源：{{SOURCE}}；原图未改，标注为本号所加</span><span>AI 吠点</span></div>
  <script>
    // Fit the screenshot into the space between the header and the panel:
    // at most 940 px wide, never upscaled past 2x, centred horizontally.
    const shot = document.querySelector('.shot');
    const W = {{W}}, H = {{H}}, TOP = 116, GAP = 28;
    const avail = document.querySelector('.panel').getBoundingClientRect().top - TOP - GAP;
    const s = Math.min(940 / W, avail / H, 2);
    shot.style.setProperty('--s', s);
    shot.style.transform = `scale(${s})`;
    shot.style.left = `${Math.round((1080 - W * s) / 2)}px`;
    // A short screenshot leaves a hole between it and the panel: keep them together
    // and split the free height 35% above the screenshot, 65% below the panel.
    const slack = Math.max(0, avail - H * s);
    const above = Math.round(0.35 * slack);
    shot.style.top = `${TOP + above}px`;
    document.querySelector('.panel').style.bottom = `${90 + Math.round(slack) - above}px`;
    // Space markers at least 44 card px apart (they move with the screenshot), top to bottom, in note order.
    let prev = -Infinity;
    for (const mk of document.querySelectorAll('.mk')) {
      const y = Math.max(Number(mk.dataset.y), prev + 44 / s);
      mk.style.top = `${y}px`;
      prev = y;
    }
    // Report overflow instead of silently shipping a squeezed or clipped card.
    const problems = [];
    // Squeezed below 75% of its fit-to-width size, the English becomes unreadable.
    const fit = Math.min(940 / W, 2);
    if (s < 0.75 * fit || W * s < 520) problems.push(`说明区过长，底图被压到 ${Math.round(100 * s / fit)}%（${Math.round(W * s)} px 宽）`);
    if (document.querySelector('.head').getBoundingClientRect().bottom > TOP - 4) problems.push('标题过长，压到底图');
    const marks = [...document.querySelectorAll('.mk')];
    const shotBottom = shot.getBoundingClientRect().bottom;
    if (marks.length && marks[marks.length - 1].getBoundingClientRect().bottom > shotBottom + 24) problems.push('编号太多，排到底图之外');
    const foot = document.querySelector('.foot');
    if (foot.scrollWidth > foot.clientWidth + 1) problems.push('页脚来源过长，超出一行');
    if (document.querySelector('.panel').getBoundingClientRect().bottom > foot.getBoundingClientRect().top - 8) problems.push('说明区压到页脚');
    document.body.dataset.layout = problems.length ? `overflow:${problems.join('；')}` : 'ok';
  </script>
</body></html>
