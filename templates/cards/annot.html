<!doctype html>
<!--
  批注截图模板（images/NN-name.png，1080×1440）。样例为 0926 期图 1，已获 Develata 认可（2026-10-02）。
  底图是原始裁切图 NN-name-raw.png，像素不改；高亮、下划线、编号都按底图原始像素坐标叠加。
  每期改：
    1. .head 标题；img src 用 file:/// 绝对路径指向底图。
    2. .shot 的 width/height = 底图像素尺寸；scale = 940 / 底图宽（2 倍图约 0.7）；底图过高时减小 scale，保证 .panel 不压图。
    3. 每个关键句按行各放一个 .hl（一句跨行就放多个，不用一个大框扫进邻句）；坐标用 tesseract 取词框，见 README.md。
       .hl.a / .hl.b 分别对应编号 1 / 2；.ul 是对关键限定词的下划线；.mk 是页边编号。
    4. 译注是关键句直译，措辞照 fact-check.md；吠点取正文原句。二者分栏，不混写。
    5. 页脚：来源域名与存档日期。
  渲染后必须打开 PNG 逐处核对高亮位置，见 README.md。
-->
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1440px; background: #f6f4ef; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; color: #1b1b1b; position: relative; overflow: hidden; }
  .head { position: absolute; left: 60px; top: 44px; right: 60px; display: flex; align-items: center; gap: 16px; }
  .tag { background: #1b1b1b; color: #fff; font-size: 26px; font-weight: 700; padding: 6px 16px; border-radius: 6px; }
  .head .t { font-size: 30px; font-weight: 700; }
  /* Screenshot: original pixels, scaled as a whole; overlays use original coordinates. */
  .shot { position: absolute; left: 70px; top: 116px; width: 660px; height: 525px; transform: scale(1.40); transform-origin: 0 0; background: #fff; box-shadow: 0 0 0 1px #d9d5cc; }
  .shot img { display: block; width: 100%; height: 100%; }
  .hl { position: absolute; mix-blend-mode: multiply; border-radius: 2px; }
  .a { background: rgba(255, 210, 0, .55); }
  .b { background: rgba(255, 140, 90, .45); }
  .ul { position: absolute; height: 2px; background: #d6336c; }
  .mk { position: absolute; width: 26px; height: 26px; border-radius: 50%; color: #fff; font: 700 17px/26px "Noto Sans SC", sans-serif; text-align: center; transform: translateX(-100%); }
  .mk.a1 { background: #c99a00; } .mk.b1 { background: #e8590c; }
  .panel { position: absolute; left: 60px; right: 60px; top: 878px; }
  .row { display: flex; gap: 18px; margin-bottom: 18px; }
  .n { flex: none; width: 46px; height: 46px; border-radius: 50%; color: #fff; font-size: 26px; font-weight: 700; line-height: 46px; text-align: center; margin-top: 2px; }
  .n.a1 { background: #c99a00; } .n.b1 { background: #e8590c; }
  .lab { font-size: 22px; font-weight: 700; color: #6b665c; letter-spacing: 1px; }
  .tx { font-size: 32px; line-height: 1.42; font-weight: 500; }
  .tx em { font-style: normal; background: linear-gradient(transparent 62%, rgba(214, 51, 108, .28) 0); }
  .q { text-indent: -.45em; }
  .bark { margin-top: 6px; border-left: 8px solid #1f4fd1; background: #e8edfb; padding: 18px 24px; border-radius: 0 10px 10px 0; }
  .bark .lab { color: #1f4fd1; }
  .foot { position: absolute; left: 60px; right: 60px; bottom: 34px; font-size: 21px; color: #7a756b; display: flex; justify-content: space-between; }
</style></head>
<body>
  <div class="head"><span class="tag">原文截图</span><span class="t">OpenAI 事故报告 · DNS 越界</span></div>

  <div class="shot">
    <img src="file:///E:/gitclone/AI-Barking/docs/2609/0926/images/01-openai-dns-pause.png" alt="">
    <!-- 1：15 分钟报警 … 2.5 小时后停 -->
    <div class="hl a" style="left:18px; top:366px; width:583px; height:15px"></div>
    <div class="hl a" style="left:18px; top:382px; width:503px; height:15px"></div>
    <!-- 2：暂停范围 -->
    <div class="hl b" style="left:522px; top:382px; width:75px; height:15px"></div>
    <div class="hl b" style="left:18px; top:398px; width:600px; height:15px"></div>
    <div class="hl b" style="left:18px; top:414px; width:52px; height:15px"></div>
    <div class="ul" style="left:186px; top:413px; width:198px"></div>
    <div class="mk a1" style="left:16px; top:360px;">1</div>
    <div class="mk b1" style="left:16px; top:395px;">2</div>
  </div>

  <div class="panel">
    <div class="row"><div class="n a1">1</div><div>
      <div class="lab">译注</div>
      <div class="tx">监控系统 15 分钟内报警，3 分钟后有人开始查看；这次运行 2.5 小时后才被停掉。</div>
    </div></div>
    <div class="row"><div class="n b1">2</div><div>
      <div class="lab">译注</div>
      <div class="tx">最强模型所有<em>涉及工具调用（广义）</em>的训练、评测和推理，仍在暂停。</div>
    </div></div>
    <div class="bark">
      <div class="lab">吠点</div>
      <div class="tx q">“停训”有范围：新暂停只限最强模型带工具的训练、评测、推理。</div>
    </div>
  </div>

  <div class="foot"><span>来源：alignment.openai.com 原文截图（2026-09-27 存档），未改动原文</span><span>AI 吠点</span></div>
</body></html>
