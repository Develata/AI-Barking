<!doctype html>
<!--
  省流卡模板（images/00-tldr.png，1080×1440），由 `barking card` 填充；内容写在期次的 images/cards.toml。
  版式 2026-10-02 经 Develata 认可。占位符：{{DATE}} {{ITEMS}}。内容超出版面时脚本在 <body data-layout> 写明，barking card 读到即报错。
-->
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1440px; background: #f6f4ef; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; color: #1b1b1b; position: relative; overflow: hidden; }
  .top { position: absolute; left: 72px; right: 72px; top: 70px; display: flex; align-items: baseline; justify-content: space-between; }
  .top h1 { font-size: 96px; font-weight: 900; letter-spacing: 6px; }
  .top .d { font-size: 28px; color: #7a756b; }
  .rule { position: absolute; left: 72px; right: 72px; top: 200px; height: 6px; background: #1b1b1b; }
  .items { position: absolute; left: 72px; right: 72px; top: 240px; bottom: 140px; display: flex; flex-direction: column; justify-content: space-evenly; }
  .k { display: inline-block; font-size: 30px; font-weight: 700; color: #fff; background: #1b1b1b; padding: 4px 14px; border-radius: 6px; }
  .fact { font-size: 44px; line-height: 1.42; font-weight: 700; margin-top: 18px; }
  .bark { margin-top: 22px; border-left: 10px solid #e8590c; padding: 6px 0 6px 24px; }
  .bark .l { font-size: 24px; font-weight: 700; color: #e8590c; letter-spacing: 2px; }
  .bark .t { font-size: 36px; line-height: 1.45; font-weight: 500; margin-top: 4px; }
  .bark + .bark { margin-top: 18px; }
  /* Lines opening with a full-width quote hang it, so the text edge stays aligned. */
  .q { text-indent: -.45em; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 50px; font-size: 22px; color: #7a756b; display: flex; justify-content: space-between; border-top: 2px solid #d9d5cc; padding-top: 18px; }
</style></head>
<body>
  <div class="top"><h1>省流</h1><span class="d">AI 吠点 · {{DATE}}</span></div>
  <div class="rule"></div>
  <div class="items">
{{ITEMS}}
  </div>
  <div class="foot"><span>本号整理，非原文截图；原文依据见后续截图</span><span>AI 吠点</span></div>
  <script>
    // Report overflow instead of silently clipping a 吠点 (barking card reads this).
    const items = document.querySelector('.items');
    document.body.dataset.layout = items.scrollHeight > items.clientHeight + 1
      ? `overflow:条目超出版面 ${items.scrollHeight - items.clientHeight} px，删减条目或吠点` : 'ok';
  </script>
</body></html>
