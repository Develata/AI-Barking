<!doctype html>
<!--
  事件卡模板（images/publish/NN-event-K.png，1080×1440，K 为主帖序号；1028 期是 images/00-event-N.png），由 `barking card` 填充；内容写在期次的 images/cards.toml 的 [[event]]。
  2026-10-29 起每个主帖一张，排在该主帖吠点卡之前：小标题取自速览里同 tag 的主帖条目，下面逐字列出正文该主帖小节里小节标题行之后、“吠点：”行之前的全部非空行，一行一段、不加编号。与吠点卡同版式、与省流卡同一套纸白配色，彩条与标签取该主帖在省流卡上的颜色。
  占位符：{{CLASS}} {{DATE}} {{TAG}} {{TITLE}} {{ITEMS}}。段落从顶部排起，字号从 52px 逐级缩到 36px 仍放不下时，脚本在 <body data-layout> 写明，barking card 读到即报错。
-->
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1440px; background: #f6f4ef; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; color: #1b1b1b; position: relative; overflow: hidden; --fs: 52px; }
  /* Same four highlighter colours as tldr.html / annot.html (.c1 … .c4). */
  body.c1 { --c: #c29a2e; --h: rgba(255, 210, 0, .55); }
  body.c2 { --c: #d8703f; --h: rgba(255, 140, 90, .45); }
  body.c3 { --c: #4d9a68; --h: rgba(110, 210, 120, .45); }
  body.c4 { --c: #7c68c4; --h: rgba(190, 140, 255, .45); }
  .top { position: absolute; left: 72px; right: 72px; top: 70px; display: flex; align-items: baseline; justify-content: space-between; }
  .top h1 { font-size: 96px; font-weight: 900; letter-spacing: 6px; }
  .top .d { font-size: 28px; color: #7a756b; }
  .rule { position: absolute; left: 72px; right: 72px; top: 200px; height: 6px; background: #1b1b1b; }
  .main { position: absolute; left: 72px; right: 72px; top: 236px; bottom: 140px; display: flex; flex-direction: column; }
  .head { flex: none; padding-bottom: 24px; margin-bottom: 28px; border-bottom: 2px dashed #d9d5cc; }
  .k { display: inline-block; font-size: 30px; font-weight: 700; background: var(--h); padding: 4px 14px; border-radius: 6px; }
  .t { font-size: 54px; line-height: 1.3; font-weight: 900; margin-top: 14px; text-wrap: balance; }
  .items { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-start; gap: 28px; }
  .pt { display: block; background: #fbfaf6; border: 2px solid #e6e1d6; border-left: 12px solid var(--c); border-radius: 0 14px 14px 0; padding: 22px 28px 24px 28px; }
  .tx { font-size: var(--fs); line-height: 1.5; font-weight: 500; text-wrap: pretty; }
  .q { text-indent: -.45em; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 50px; font-size: 22px; color: #7a756b; display: flex; justify-content: space-between; border-top: 2px solid #d9d5cc; padding-top: 18px; }
</style></head>
<body class="{{CLASS}}">
  <div class="top"><h1>事件</h1><span class="d">AI 吠点 · {{DATE}}</span></div>
  <div class="rule"></div>
  <div class="main">
    <div class="head"><span class="k">{{TAG}}</span><div class="t">{{TITLE}}</div></div>
    <div class="items">
{{ITEMS}}
    </div>
  </div>
  <div class="foot"><span>本号整理，非原文截图</span><span>AI 吠点</span></div>
  <script>
    // Shrink the type step by step until every paragraph fits; report overflow
    // instead of silently clipping a paragraph (barking card reads this).
    const items = document.querySelector('.items');
    const fits = () => items.scrollHeight <= items.clientHeight + 1;
    let fs = 52;
    while (!fits() && fs > 36) {
      fs -= 2;
      document.body.style.setProperty('--fs', fs + 'px');
    }
    document.body.dataset.layout = fits() ? 'ok'
      : `overflow:事件段超出版面 ${items.scrollHeight - items.clientHeight} px（字号已缩到 36px），压短正文事实段`;
  </script>
</body></html>
