<!doctype html>
<!--
  速览聚合图模板（images/00-roundup.png，1080×1440），由 `barking card` 填充；内容写在期次的 images/cards.toml 的 [[roundup]]。
  2026-10-04 起。与省流卡同一套纸白配色；主帖条目只写短标题并标“详见前页”，排在最前。占位符：{{DATE}} {{ITEMS}}。
  内容超出版面时脚本在 <body data-layout> 写明，barking card 读到即报错。
-->
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1440px; background: #f6f4ef; font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; color: #1b1b1b; position: relative; overflow: hidden; }
  .top { position: absolute; left: 72px; right: 72px; top: 56px; display: flex; align-items: baseline; justify-content: space-between; }
  .top h1 { font-size: 88px; font-weight: 900; letter-spacing: 6px; }
  .top .d { font-size: 28px; color: #7a756b; }
  .rule { position: absolute; left: 72px; right: 72px; top: 176px; height: 6px; background: #1b1b1b; }
  .items { position: absolute; left: 72px; right: 72px; top: 206px; bottom: 112px; display: flex; flex-direction: column; justify-content: space-evenly; }
  /* Same four highlighter colours as tldr.html / annot.html (.c1 … .c4). */
  .item.c1 { --c: #c29a2e; --h: rgba(255, 210, 0, .55); }
  .item.c2 { --c: #d8703f; --h: rgba(255, 140, 90, .45); }
  .item.c3 { --c: #4d9a68; --h: rgba(110, 210, 120, .45); }
  .item.c4 { --c: #7c68c4; --h: rgba(190, 140, 255, .45); }
  .item { display: flex; align-items: flex-start; gap: 16px; border-left: 10px solid var(--c); padding: 4px 0 4px 20px; }
  .n { flex: none; width: 46px; font-size: 34px; line-height: 1.4; font-weight: 900; color: var(--c); }
  .tx { font-size: 36px; line-height: 1.4; font-weight: 700; text-wrap: pretty; }
  .k { display: inline-block; font-size: 28px; line-height: 1.3; font-weight: 700; background: var(--h); padding: 1px 10px; border-radius: 6px; margin-right: 12px; vertical-align: 3px; }
  /* Main-post entries: one short line, pointing back to the 省流卡. */
  .item.main { background: #fbfaf6; border-top: 2px solid #e6e1d6; border-bottom: 2px solid #e6e1d6; border-right: 2px solid #e6e1d6; border-radius: 0 12px 12px 0; padding: 10px 20px; }
  .see { font-size: 26px; font-weight: 500; color: #7a756b; margin-left: 14px; white-space: nowrap; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 44px; font-size: 22px; color: #7a756b; display: flex; justify-content: space-between; border-top: 2px solid #d9d5cc; padding-top: 16px; }
</style></head>
<body>
  <div class="top"><h1>速览</h1><span class="d">AI 吠点 · {{DATE}}</span></div>
  <div class="rule"></div>
  <div class="items">
{{ITEMS}}
  </div>
  <div class="foot"><span>本号整理，非原文截图；只列事实，措辞依原始来源</span><span>AI 吠点</span></div>
  <script>
    // Report overflow instead of silently clipping an item (barking card reads this).
    // A main-post entry is a one-line pointer to the 省流卡; a second line means the title is too long.
    const items = document.querySelector('.items');
    const wrapped = [...document.querySelectorAll('.item.main .tx')]
      .filter(t => t.getClientRects().length && t.offsetHeight > parseFloat(getComputedStyle(t).lineHeight) * 1.5);
    document.body.dataset.layout = items.scrollHeight > items.clientHeight + 1
      ? `overflow:条目超出版面 ${items.scrollHeight - items.clientHeight} px，删减条目或缩短句子`
      : wrapped.length ? `overflow:主帖条目「${wrapped[0].textContent}」超过一行，换更短的正文摘句` : 'ok';
  </script>
</body></html>
