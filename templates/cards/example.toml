# images/cards.toml 样例（0926 期，版式 2026-10-02 经 Develata 认可）。
# 用法：复制到期次的 images/cards.toml，改内容后运行
#   cargo run --release --manifest-path tools/barking/Cargo.toml -- card <期次目录>
# 规则见 EDITORIAL.md“省流卡与批注截图”。lint 会逐字核对：fact 必须出现在正文里（忽略空白与句末标点）。
# 2026-10-03 起图上不放吠点（与正文重复）：省流卡只列事实，批注图只有原文批注与译注；旧期次 cards.toml 里的 barks / bark 仅作历史记录，写了会拒绝渲染。
# 一句可用“；”拼接正文中不相邻的几段原文，每段各自逐字核对；不要只摘半句而丢掉同句里改变含义的限定。

# 省流卡 images/00-tldr.png
date = "9月26日"

[[tldr]]
tag = "OpenAI"
fact = "又披露 agent 越界：一个借 DNS 漏洞连上外部聊天机器人；研究环境中的 agent 曾53次把训练数据里的用户图片传上图床。"

[[tldr]]
tag = "Claude"
fact = "算出理论物理“九环”振幅。"

# 速览聚合图 images/00-roundup.png（2026-10-04 起每期必做，规则见 EDITORIAL.md“速览”）。共 5–10 条。
# 主帖条目 main = true：连续排在最前，tag 与上面 [[tldr]] 一一对应、顺序相同；text 是一行短标题，须从正文逐字摘取（≤20 字）。
# 其余条目：一句事实（≤40 字），须逐字列在 sources/fact-check.md 的“速览”一节，lint 按那一行的级别检查措辞：
#   L1–L3 须 ✅；L4 写“据某媒体报道”（直接点名；只在 X 等大陆无法访问的平台上的报道写“据外媒报道”）；不收 L5–L7、不写“网传”。
# 卡片文字（含 tag、title、source、gloss）不写 X/推特、YouTube、Facebook、Instagram、Telegram，见 EDITORIAL.md 事实分级。
# 没有主帖的日子发速览专帖：顶部写 kind = "roundup"，不写 [[tldr]]，也不写 main；封面由模板渲染（00-cover.png、00-cover-wide.png）。
# 下面三条非主帖条目只是演示格式，并非 0926 期内容。
[[roundup]]
tag = "OpenAI"
main = true
text = "又披露 agent 越界"

[[roundup]]
tag = "Claude"
main = true
text = "算出理论物理“九环”振幅"

[[roundup]]
tag = "示例甲"
text = "甲公司发布某模型，称在自家评测中领先"

[[roundup]]
tag = "示例乙"
text = "据外媒报道，乙公司下一代芯片量产推迟"

[[roundup]]
tag = "示例丙"
text = "丙机构榜单更新，某模型升至文本总榜第一"

# 批注截图：images/<out>，底图为同名加 -raw 的 images/<stem>-raw.png（像素不改）。
[[annot]]
out = "01-openai-dns-pause.png"
title = "OpenAI 事故报告 · DNS 越界"
source = "alignment.openai.com 原文截图（2026-09-27 存档）"   # 页脚自动接“原图未改，标注为本号所加”；整行须放得下
lang = "eng"           # tesseract 语言；中文媒体截图用 "chi_sim+eng"

[[annot.note]]
# quote：关键句原文，逐字（标点、大小写不计）；工具用 OCR 找到它，按行加高亮。找不到或不唯一就报错。
quote = "Our misalignment monitoring system flagged the behavior within 15 minutes and a person began reviewing it three minutes after that. The run was killed 2.5 hours later."
gloss = "监控系统 15 分钟内报警，3 分钟后有人开始查看；2.5 小时后，这次运行被停掉。"

[[annot.note]]
quote = "All training, evaluation, and inference with tool-use (defined broadly) of our most capable models remain paused."
gloss = "最强模型所有涉及工具调用（广义）的训练、评测和推理，仍在暂停。"
underline = "with tool-use (defined broadly)"   # 可选：原文中要加下划线的限定词
emph = "涉及工具调用（广义）"                 # 可选：译注中对应的强调片段
# OCR 认不准（拼接图、低清图）时，删掉 quote，改用手量的底图像素坐标 [x, y, w, h]，每行一个（此时不能用 underline）：
# rects = [[18, 366, 583, 15], [18, 382, 503, 15]]
