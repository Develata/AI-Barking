# 封面抽签牌组（EDITORIAL.md 封面“每期抽签”）。
#
# `barking cover-draw <期次目录>` 按本文件抽两组（A、B），每组每个轴一个取值；
# 某轴最近 avoid_last 期（只数记有“封面抽签：”行的期次）用过的取值不进本期抽签。
# 选中的一组照抄进本期 images/README.md 封面节，成一行：
#   封面抽签：画风=…；底色=…；标题=…；看板娘=…；动作=…
# `barking lint` 从 1025 期起检查这一行：轴要齐，取值要在本文件里，且不与前几期重复。
#
# 取值是粗分的“桶”：同一桶里的细分画风（丝网、木刻、老广告）看上去是一家，
# 所以算同一个值。加桶、改 avoid_last 时注意每轴取值数须大于 avoid_last。

[[axis]]
key = "画风"
avoid_last = 3
values = [
  { name = "复古印刷", hint = "丝网印刷、网点漫画、木刻或麻胶版画、老海报、老杂志广告插画" },
  { name = "纸艺手工", hint = "纸雕、剪纸、毛毡、折纸、拼贴、刺绣" },
  { name = "立体模型", hint = "黏土定格动画、积木玩具、等距微缩场景、3D 渲染的玩具质感" },
  { name = "像素游戏", hint = "8-bit/16-bit 游戏画面、RPG 对话框与血条、街机屏、游戏卡带包装" },
  { name = "东方传统", hint = "水墨、年画、工笔、浮世绘、皮影" },
  { name = "绘本手绘", hint = "水彩、彩铅、蜡笔、儿童绘本" },
  { name = "技术图版", hint = "蓝图、专利图、说明书分解图、科学图版、X 光片、示波器屏" },
  { name = "实物摄影", hint = "桌面实物摆拍、微距、产品静物；看板娘以手办或玩偶出现；不拍真人" },
  { name = "霓虹赛博", hint = "霓虹灯牌、赛博夜景、故障艺术、蒸汽波" },
  { name = "拟物版面", hint = "报纸头版、票据证件、系统弹窗、聊天界面、电视直播画面（不仿真实品牌界面）" },
  { name = "黑白漫画", hint = "分格漫画、四格、日式黑白网点分镜，标题做成对白框或拟声字" },
  { name = "粉笔涂鸦", hint = "黑板粉笔、白板马克笔、街头涂鸦、便利贴墙" },
  { name = "名画戏仿", hint = "古典油画或名画构图的恶搞（不用真人肖像）、厚涂" },
]

[[axis]]
key = "底色"
avoid_last = 1
values = [
  { name = "浅色", hint = "米白、纸白、浅灰为底" },
  { name = "深色", hint = "黑、深蓝、夜景为底" },
  { name = "亮色", hint = "整幅高饱和单色或撞色为底" },
  { name = "满幅场景", hint = "没有纯色底，环境铺满画面" },
]

[[axis]]
key = "标题"
avoid_last = 1
values = [
  { name = "顶部横排", hint = "顶部大字横排" },
  { name = "嵌进物件", hint = "做成画中的招牌、屏幕、报头、横幅、包装上的字" },
  { name = "压在下方", hint = "放在画面中段或底部，压在主体上" },
  { name = "斜放竖排", hint = "倾斜、竖排或沿物体弯曲" },
  { name = "手写字", hint = "手写、涂鸦或对白框里的字，仍须缩略图可读" },
]

[[axis]]
key = "看板娘"
avoid_last = 1
values = [
  { name = "全身", hint = "完整全身入画" },
  { name = "半身", hint = "腰部以上" },
  { name = "探头", hint = "从画框、物件后探出，或只露耳朵、尾巴、手" },
  { name = "小人", hint = "画面里的小角色，主体另有其物" },
  { name = "大特写", hint = "脸或上半身占画面一半以上" },
]

[[axis]]
key = "动作"
avoid_last = 2
values = [
  { name = "查验", hint = "放大镜、卷尺、指认、夹板、举手叫停" },
  { name = "动手", hint = "拔插头、拉闸、追赶、搬运、修理" },
  { name = "反应", hint = "震惊、大笑、捂脸、瘫倒、吐槽" },
  { name = "扮演", hint = "换装成当期场景里的角色：主播、安检员、侦探、店员、裁判" },
  { name = "旁观", hint = "吃瓜、喝茶、躲着偷看、记笔记" },
]
